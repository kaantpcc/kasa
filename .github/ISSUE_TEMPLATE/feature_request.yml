name: Feature request
description: Suggest a new capability or an improvement to Kasa.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it hard with Kasa today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: How would you like it to work? A short code sample of the API you have in mind is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve the problem, including workarounds you use today.
