name: Bug report
description: Kasa does not behave as documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        For security problems, please do not open an issue. Follow SECURITY.md instead.

  - type: input
    id: kasa-version
    attributes:
      label: Kasa version
      description: The release version, or the commit hash if you built from source.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "25"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The steps to reproduce the problem. A small code sample or a failing test helps the most.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Stack trace or output
      description: Paste any exception or output. It will be formatted as code.
      render: text
